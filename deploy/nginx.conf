# /etc/nginx/sites-available/aliph.studio
#
# Reverse proxy for the Hostinger VPS deployment. Symlink into sites-enabled,
# then run `certbot --nginx -d aliph.studio -d www.aliph.studio` — certbot
# rewrites the TLS block below with real certificate paths.

# Redirect the .com you registered for international clients typing from
# memory. A 301 passes the ranking signal to the canonical domain.
server {
    listen 80;
    listen [::]:80;
    server_name aliphstudio.com www.aliphstudio.com;
    return 301 https://aliph.studio$request_uri;
}

# Force HTTPS on the canonical domain.
server {
    listen 80;
    listen [::]:80;
    server_name aliph.studio www.aliph.studio;
    return 301 https://aliph.studio$request_uri;
}

# Collapse www into the bare domain so canonical stays single-valued.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aliph.studio;

    ssl_certificate     /etc/letsencrypt/live/aliph.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliph.studio/privkey.pem;

    return 301 https://aliph.studio$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aliph.studio;

    ssl_certificate     /etc/letsencrypt/live/aliph.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliph.studio/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next already gzips, but brotli/gzip here covers proxied responses too.
    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;
    gzip_min_length   1024;

    # Uploads are small; the contact form is the only POST target.
    client_max_body_size 2M;

    # Immutable build assets — hashed filenames, safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The contact form's rate limiter reads x-forwarded-for. Without
        # these headers every visitor looks like the same IP and the limiter
        # would throttle everyone at once.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering    on;
    }
}
